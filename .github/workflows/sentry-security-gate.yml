# Sentry fork security gate (HRM-00367 OpenSEO adoption).
# Fails if any production dependency has a critical or high advisory,
# or if tests, typecheck or build fail. Runs on push, pull request and weekly.
name: sentry-security-gate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Lockfile is regenerated here because the security floors changed.
      - run: pnpm install --no-frozen-lockfile
      - name: Production dependency audit (0 critical, 0 high)
        run: pnpm audit --prod --audit-level high
      - run: pnpm test:ci
      - run: pnpm build
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
